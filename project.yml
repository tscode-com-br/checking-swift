# XcodeGen spec — gera Checking.xcodeproj a partir desta árvore de arquivos.
#   $ brew install xcodegen && cd ios && xcodegen generate
# Depois abra Checking.xcodeproj no Xcode. O .xcodeproj é ignorado no git (regenerável).
name: Checking

options:
  bundleIdPrefix: br.com.tscode
  deploymentTarget:
    iOS: "17.0"          # plano §5 (iOS mínimo 17.0)
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: pt-BR   # fallback per-key para pt (port_spec_i18n)
  generateEmptyDirectories: true

configs:
  Debug: debug
  Staging: release
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"                 # plano §5 — Swift 6
    SWIFT_STRICT_CONCURRENCY: complete   # concorrência estrita
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "F8Z6CMJHAR"       # Equipe configurada para os builds físicos de desenvolvimento
    PRODUCT_BUNDLE_IDENTIFIER: $(CHECKING_BUNDLE_ID)   # vem do .xcconfig
    GENERATE_INFOPLIST_FILE: NO

targets:
  Checking:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: Checking
    settings:
      base:
        INFOPLIST_FILE: Checking/Info.plist
        CODE_SIGN_ENTITLEMENTS: Checking/Checking.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CFBundleDisplayName: $(CHECKING_APP_NAME)

  CheckingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CheckingTests
    dependencies:
      - target: Checking
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete

  CheckingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CheckingUITests
    dependencies:
      - target: Checking
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Checking:
    build:
      targets:
        Checking: all
        CheckingTests: [test]
        CheckingUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - CheckingTests
        - CheckingUITests
  Checking (Staging):
    build: { targets: { Checking: all } }
    run: { config: Staging }
  Checking (Release):
    build: { targets: { Checking: all } }
    run: { config: Release }
